[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-physical-planner"
version = "0.1.0"
description = "Inspectable neural hardware planning with guarded physical transformations and multi-objective search"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pydantic>=2.6,<3"]
readme = "README.md"

[project.scripts]
npp = "npp.cli:main"

[tool.setuptools.packages.find]
include = ["npp*"]

[tool.setuptools.package-data]
npp = ["data/*.json"]
